name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Android Project
        shell: bash
        run: |
          set -e

          PROJECT_ROOT=""

          if [ -f "settings.gradle.kts" ] && [ -f "app/build.gradle.kts" ]; then
            PROJECT_ROOT="$PWD"
          fi

          if [ -z "$PROJECT_ROOT" ]; then
            ZIP_FILE=$(find . -type f -iname "*.zip" | head -n 1 || true)

            if [ -n "$ZIP_FILE" ]; then
              echo "ZIP found: $ZIP_FILE"
              mkdir -p extracted-project
              unzip -q "$ZIP_FILE" -d extracted-project
            fi
          fi

          if [ -z "$PROJECT_ROOT" ]; then
            SETTINGS_FILE=$(find . -type f -name "settings.gradle.kts" | head -n 1 || true)

            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_ROOT="$(cd "$(dirname "$SETTINGS_FILE")" && pwd)"
            fi
          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: Android project not found"
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Project root:"
          echo "$PROJECT_ROOT"

      - name: Fix Gradle Configuration
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo "android.disallowKotlinSourceSets=false" >> gradle.properties

          echo "Gradle properties:"
          cat gradle.properties

      - name: Fix KSP Version
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          if grep -q 'googleDevtoolsKsp = "2.3.5"' gradle/libs.versions.toml; then
            sed -i 's/googleDevtoolsKsp = "2.3.5"/googleDevtoolsKsp = "2.2.10-2.0.2"/' gradle/libs.versions.toml
          fi

          echo "KSP version:"
          grep "googleDevtoolsKsp" gradle/libs.versions.toml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platforms;android-36" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          gradle clean assembleDebug --stacktrace

      - name: Find APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          echo "APK files:"
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
